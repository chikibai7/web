# Sitio estático: se publica la raíz del repositorio tal cual.
# Único paso al desplegar: cambiar la dirección provisional (delegapisos.netlify.app) por la real
# del proyecto, que Netlify da en $URL. Vale para el nombre que asigne Netlify y para un dominio
# propio en el futuro (tras añadirlo, basta con volver a desplegar).
[build]
  publish = "."
  command = '[ -z "$URL" ] || sed -i "s#https://delegapisos.netlify.app#$URL#g" index.html privacidad.html aviso-legal.html robots.txt sitemap.xml'

# Cabeceras de seguridad. La CSP solo permite recursos del propio dominio:
# si alguien añade un script, una fuente o un iframe de terceros, el navegador lo bloquea.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000"

# Las fuentes no cambian: caché de un año
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes: caché de una semana (si se cambia una foto, mejor con nombre nuevo)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
